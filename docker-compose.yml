services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: xagent-postgres

    environment:
      POSTGRES_DB: xagent
      POSTGRES_USER: xagent
      POSTGRES_PASSWORD: xagent_dev

    ports:
      - "5432:5432"

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xagent -d xagent"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped
