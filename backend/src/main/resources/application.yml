spring:
  application:
    name: xagent

  datasource:
    url: jdbc:postgresql://localhost:5432/xagent
    username: xagent
    password: xagent_dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

xagent:
  ai:
    base-url: ${XAGENT_AI_BASE_URL:http://localhost:11434}
    model: ${XAGENT_AI_MODEL:xagent-qwen}

  x:
    oauth:
      client-id: ${XAGENT_X_CLIENT_ID}
      client-secret: ${XAGENT_X_CLIENT_SECRET}
      redirect-uri: ${XAGENT_X_REDIRECT_URI:http://127.0.0.1:8080/api/v1/x/oauth/callback}
      authorize-url: https://x.com/i/oauth2/authorize
      token-url: https://api.x.com/2/oauth2/token
      scopes:
        - tweet.read
        - tweet.write
        - users.read
        - offline.access